# Packs js-prueffactory from every push to main and publishes the tarball in
# the prerelease main-latest. Its tag moves to the pushed commit, so the
# download URLs stay the same. A push whose tests fail publishes nothing.
name: main build

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: main-build
  cancel-in-progress: true

jobs:
  build:
    name: Test, pack and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # move the main-latest tag and replace the release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      # The packing step writes the commit into the package, so Reports name it
      # as producer.vcs_revision, and fails without one. The tarball goes
      # outside the work tree.
      - name: Pack
        run: |
          mkdir "$RUNNER_TEMP/dist"
          node dev/pack/main.ts -o "$RUNNER_TEMP/dist/js-prueffactory.tgz"
          (cd "$RUNNER_TEMP/dist" && sha256sum js-prueffactory.tgz > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: main-latest
        run: |
          notes="Built from $GITHUB_SHA, the latest commit on main whose tests pass. Replaced on every push to main. Install with: npm install --global https://github.com/$GH_REPO/releases/download/$TAG/js-prueffactory.tgz"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" "$RUNNER_TEMP"/dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Latest main build" --notes "$notes"
          fi
          # The Go binaries of the builds before the TypeScript cutover. They
          # go after the upload, so a failed upload leaves the release as it was.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in js-prueffactory-linux-amd64 js-prueffactory-linux-arm64 js-prueffactory-darwin-arm64; do
            if printf '%s\n' "$assets" | grep -qx "$asset"; then
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done
