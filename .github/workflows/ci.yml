# Checks every pull request and every push to main: the pre-commit hooks (file
# hygiene, actionlint, zizmor, ESLint, Prettier, the type check and the
# lockfile check), the fast tests on every supported Node major, the Docker
# tests and a vulnerability scan of the package lockfile.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The ESLint, Prettier and type check hooks run the package's own tools.
      - run: npm ci --ignore-scripts
      - name: Run every hook on every file
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure

  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test

  docker-test:
    name: npm run test:docker
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run test:docker

  osv-scanner:
    name: osv-scanner (package-lock.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image the tool itself pins (internal/toolset/osvscanner.ts), by
      # digest. Exit code 1 means the lockfile has a known vulnerability.
      - name: Scan the lockfile
        env:
          OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 # v2.7.0
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/work:ro" "$OSV_SCANNER_IMAGE" \
            scan --lockfile /work/package-lock.json
