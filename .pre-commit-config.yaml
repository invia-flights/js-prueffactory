# Install once with `pre-commit install`, after `npm ci --ignore-scripts`: the
# TypeScript hooks run the package's own pinned tools. CI runs every hook on
# every file (.github/workflows/ci.yml). testdata/ holds deliberately broken
# projects and byte-exact golden files, so no hook touches it.
exclude: (^|/)testdata/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--enforce-all]
      - id: check-merge-conflict
      - id: check-json
        # JSON with comments, read by tsc.
        exclude: ^tsconfig(\.build)?\.json$
      - id: check-yaml
      # internal/checks/data/ keeps upstream files byte for byte.
      - id: end-of-file-fixer
        exclude: ^internal/checks/data/
      - id: trailing-whitespace
        exclude: ^internal/checks/data/
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: lockfile
        name: package-lock.json matches package.json
        entry: npm ci --dry-run --ignore-scripts --no-audit --no-fund
        language: system
        files: ^package(-lock)?\.json$
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npm run --silent lint
        language: system
        files: \.(ts|js)$|^(package|package-lock|tsconfig)\.json$
        pass_filenames: false
      - id: prettier-check
        name: prettier --check
        entry: npm run --silent format:check
        language: system
        files: \.(ts|js|json)$|^\.prettierignore$
        pass_filenames: false
      - id: tsc
        name: tsc
        entry: npm run --silent typecheck
        language: system
        files: \.(ts|js)$|^(package|package-lock|tsconfig)\.json$
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
