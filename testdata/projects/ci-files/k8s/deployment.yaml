# A plain manifest with an invalid field: replicas is a string.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: three
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
