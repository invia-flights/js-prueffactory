services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

  # Creates the schema with the project's own image, before the tests. The Run
  # does not start it: it has a build section.
  migrate:
    build: .
    command: npm run migrate
    environment:
      DATABASE_URL: postgres://postgres@postgres:5432/postgres
    depends_on:
      - postgres
