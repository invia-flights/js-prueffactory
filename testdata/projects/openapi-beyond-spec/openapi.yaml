openapi: 3.0.3
info:
  title: Orders
  version: "1.0.0"
paths:
  # Warning (path-not-include-query): the Paths Object only requires a field
  # name to begin with a slash, so a query string in it is not invalid.
  /orders?status=open:
    get:
      operationId: listOpenOrders
      responses:
        "200":
          description: The open orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  # Error (path-parameters-defined): the specification says each template
  # expression in a path MUST correspond to a path parameter, and orderId has
  # none.
  /orders/{orderId}:
    get:
      operationId: getOrder
      responses:
        "200":
          description: One order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        # Warning (nullable-type-sibling): without type, nullable has no effect,
        # and the OpenAPI text does not call that invalid.
        note:
          nullable: true
          description: Free text of the customer
