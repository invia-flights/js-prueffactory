version: "2"

# The standard linters: errcheck, govet, ineffassign, staticcheck, unused.
linters:
  settings:
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Error strings start with tool names: Biome, Mocha, Kubernetes.
        - -ST1005
        # De Morgan rewrites; the negated form states the rule it checks.
        - -QF1001
  exclusions:
    presets:
      # Unchecked Close, Fprint*, os.Remove and the like.
      - std-error-handling

formatters:
  enable:
    - gofmt
